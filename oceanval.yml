name: oceanval
channels:
  - conda-forge
dependencies:
  - cartopy
  # with its data PROJ does not look for grids over the network (conda turns the network on without it)
  - proj-data
  - h5py
  - cftime
  # View simulation output: the maps (bokeh, holoviews, hvplot, geoviews)
  - bokeh>=3.1
  - holoviews
  - hvplot
  - geoviews-core
  # the viewer's unstructured and global curvilinear grids (oceanval/viewer_grid.py)
  - scipy
  # pressure to depth (oceanval/hansell.py)
  - gsw
  # the non-MPI builds of the netCDF libraries (the MPI ones made report builds several times slower)
  - libnetcdf=*=nompi_*
  - hdf5=*=nompi_*
  - cdo>2.1.0
  - nco
  - notebook
  - ipykernel
  # its dependencies; nctoolkit itself comes from pip, below
  - nctoolkit
  - psutil
  - matplotlib<=3.10.9
  - nodejs=22.23.2
  - python
  # the point pages' maps and scatter plots, and the regional figures (oceanval/plotnine_figures.py)
  - plotnine>=0.15
  - geopandas
  - pip
  - pip:
    # open_fvcom (raw FVCOM output) is in nctoolkit 1.4.0, which conda-forge does not have yet
    - nctoolkit>=1.4.0
