name: oceanval
channels:
  - conda-forge
dependencies:
  - cartopy
  - h5py
  - cftime
  # View simulation output: the maps (bokeh, holoviews, hvplot, geoviews)
  - bokeh>=3.1
  - holoviews
  - hvplot
  - geoviews-core
  # the viewer's unstructured and global curvilinear grids (oceanval/viewer_grid.py)
  - scipy
  # pressure to depth (oceanval/hansell.py)
  - gsw
  - cdo>2.1.0
  - nco
  - notebook
  - ipykernel
  # its dependencies; nctoolkit itself comes from pip, below
  - nctoolkit
  - psutil
  - matplotlib<=3.10.9
  - nodejs=22.23.2
  - python
  - rpy2
  - r-base
  - r-rcpp
  - r-cowplot
  - r-ggthemes
  - r-maps
  - r-mapdata
  - r-plotrix
  - r-tidyverse
  - r-ggtext
  - pip
  - pip:
    # open_fvcom (raw FVCOM output) is in nctoolkit 1.4.0, which conda-forge does not have yet
    - nctoolkit>=1.4.0
