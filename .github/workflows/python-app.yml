# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Linux tests

defaults:
  run:
    shell: bash -l {0}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: "ubuntu-latest" 
    # a run normally takes about 10 minutes, so a stalled one is stopped long
    # before GitHub's own six hour limit
    timeout-minutes: 45

    # The suite is split over six jobs that run side by side. Each job has its own
    # checkout, which matters: the matchup tests share cwd-relative output folders.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
      # - uses: mamba-org/provision-with-micromamba@v15
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          micromamba-version: '1.4.5-0'
          environment-name: foo
          create-args: nctoolkit cmocean cartopy pandoc python=3.13 rpy2 r-base r-tidyverse r-ggtext jupyter-book>=2 r-mapdata texlive-core nodejs=22.23.2 statsmodels geopandas fiona tqdm shapely notebook ipykernel h5py bokeh holoviews hvplot geoviews-core cftime dask
          init-shell: >-
            bash
          cache-environment: true
          post-cleanup: 'all'
      - name: Install dependencies
        shell: bash -l {0}
        run: |
        
          ##sudo apt-get install texlive
          mamba install pandoc r-ggthemes r-ggridges r-maps r-plotrix r-arrow r-cowplot -y
          python -m pip install .
          pip install pyarrow
          pip install rioxarray
          pip install pytest pytest-timeout

      # OceanVal needs jupyter-book 2 or later, so make sure the solver gave us it
      - name: Check jupyter-book is version 2
        shell: bash -l {0}
        run: |
          python -c "from importlib.metadata import version; v = version('jupyter-book'); print('jupyter-book', v); assert int(v.split('.')[0]) >= 2, f'jupyter-book {v} is installed, the tests need 2'"

      - name: Test with pytest (group ${{ matrix.group }} of 6)
        shell: bash -l {0}
        run: |
          # Groups 1-5 are named sets of test files, balanced by run time; group 6
          # is every other test file, so a new test file is always picked up.
          # macos-app.yml runs the same groups: change both together.
          GROUP1="tests/test_gridded_matchups.py tests/test_point_matchups.py tests/test_matchup_formula.py tests/test_transect_report.py"
          GROUP2="tests/test_matchups.py tests/test_gridded_failures.py tests/test_matchup_order.py tests/test_calendars.py tests/test_short_simulations.py tests/test_domain_mask.py tests/test_extent.py"
          GROUP3="tests/test_data_store.py tests/test_live_validation.py tests/test_analysis_report.py tests/test_fvcom.py tests/test_fvcom_analysis.py tests/test_own_data.py tests/test_user_recipes.py tests/test_model_check.py tests/test_transects.py tests/test_viewer_app.py tests/test_viewer_browser.py tests/test_viewer_catalogue.py tests/test_viewer_mesh.py tests/test_viewer_plots.py tests/test_viewer_times.py"
          GROUP4="tests/test_analysis_plots.py tests/test_analysis_changes.py tests/test_analysis_transects.py tests/test_sim_plots.py"
          GROUP5="tests/test_analysis.py tests/test_analysis_series.py tests/test_analysis_app.py tests/test_sim_unify.py tests/test_sim_compare.py tests/test_sim_compare_app.py"
          # -v names each test as it starts, and a test still running after
          # 15 minutes ends the run with every thread's stack, so a stall shows
          # which test it is and where it is stuck; --durations lists the slowest
          # tests at the end, to see where the time goes
          OPTIONS="-v --timeout=900 --timeout-method=thread --durations=30"
          case "${{ matrix.group }}" in
            1) python -m pytest $OPTIONS $GROUP1 ;;
            2) python -m pytest $OPTIONS $GROUP2 ;;
            3) python -m pytest $OPTIONS $GROUP3 ;;
            4) python -m pytest $OPTIONS $GROUP4 ;;
            5) python -m pytest $OPTIONS $GROUP5 ;;
            6) python -m pytest $OPTIONS tests $(for f in $GROUP1 $GROUP2 $GROUP3 $GROUP4 $GROUP5; do echo --ignore=$f; done) ;;
          esac
